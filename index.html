<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Marketer | Kang JiHee</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #111; 
            color: #ffffff;
        }

        /* 1. 첫 화면 (Hero Section) - 카드가 바로 보이도록 높이를 살짝 조정했습니다 */
        .hero-section {
            height: 60vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #111 0%, #1a1a1a 100%);
        }

        .hero-text {
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            font-weight: 300;
            color: #888;
            letter-spacing: 6px;
            margin-top: 0;
        }

        /* 2. 회사별 카드형 갤러리 섹션 */
        .work-section {
            padding: 40px 20px 100px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 50px;
            letter-spacing: 3px;
            color: #fff;
            font-weight: 500;
        }

        /* 그리드(바둑판) 레이아웃 설정 */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 한 줄에 2개씩 큼직하게 배치 */
            gap: 30px;
        }

        /* 반응형: 모바일 화면에서는 1줄로 변경 */
        @media (max-width: 768px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
        }

        /* 3. 카드 개별 디자인 및 효과 */
        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 50px 40px;
            text-decoration: none; /* 링크 밑줄 제거 */
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 150px;
            transition: all 0.4s ease; /* 부드러운 호버 효과 */
            
            /* 처음에 투명하게 숨겨둠 (툭툭 뜨는 효과를 위해) */
            opacity: 0;
            transform: translateY(40px);
            animation: popUp 0.8s forwards ease-out;
        }

        /* 마우스를 올렸을 때(Hover) 효과 */
        .card:hover {
            transform: translateY(-10px) !important; /* 위로 살짝 떠오름 */
            border-color: #fff;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            background: #252525;
        }

        .card h3 {
            font-size: 1.8rem;
            margin: 0 0 15px 0;
            font-weight: 700;
        }

        .card p {
            font-size: 1.1rem;
            color: #aaa;
            margin: 0;
            line-height: 1.5;
        }

        /* 카드가 순서대로 나타나도록 딜레이 시간 적용 */
        .card:nth-child(1) { animation-delay: 0.2s; }
