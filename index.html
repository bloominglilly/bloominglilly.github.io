<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Marketer | Kang JiHee</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body, html { margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; background-color: #111; color: #ffffff; }

        .hero-section { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(180deg, #111 0%, #1a1a1a 100%); }
        .hero-text { text-align: center; animation: fadeIn 1.5s ease-out; }
        h1 { font-size: 3.5rem; font-weight: 700; margin-bottom: 10px; letter-spacing: 2px; }
        p { font-size: 1.2rem; font-weight: 300; color: #888; letter-spacing: 6px; margin-top: 0; }

        .section-container { padding: 80px 20px; max-width: 1000px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 1.5rem; margin-bottom: 50px; letter-spacing: 3px; color: #fff; font-weight: 500; }

        .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; margin-bottom: 40px; }
        
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 16px; padding: 40px; text-decoration: none; color: #fff; display: flex; flex-direction: column; justify-content: center; min-height: 120px; transition: all 0.4s ease; opacity: 0; transform: translateY(40px); }
        .card:hover { transform: translateY(-10px) !important; border-color: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.4); background: #252525; }
        .card h3 { font-size: 1.5rem; margin: 0 0 10px 0; font-weight: 700; }
        .card p { font-size: 1rem; color: #aaa; margin: 0; line-height: 1.5; }

        /* 무한 확장이 가능한 프로젝트 그리드 설정 */
        .project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 25px; }
        
        .project-card { background: #1e1e1e; border: 1px solid #333; border-radius: 16px; overflow: hidden; text-decoration: none; color: #fff; display: flex; flex-direction: column; transition: all 0.4s ease; opacity: 0; transform: translateY(40px); }
        .project-card:hover { transform: translateY(-10px) !important; border-color: #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .project-img { width: 100%; height: 220px; background-color: #2a2a2a; background-size: cover; background-position: center; border-bottom: 1px solid #333; }
        .project-info { padding: 25px; display: flex; flex-direction: column; flex-grow: 1; }
        .project-tag { align-self: flex-start; background: rgba(255, 255, 255, 0.1); color: #ddd; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-bottom: 15px; letter-spacing: 1px; }
        .project-company { font-size: 0.85rem; color: #888; margin-bottom: 8px; }
        .project-title { font-size: 1.25rem; font-weight: 700; margin: 0 0 15px 0; line-height: 1.4; }
        .project-desc { font-size: 0.95rem; color: #aaa; line-height: 1.6; margin: 0; }

        @media (max-width: 768px) { .card-grid, .project-grid { grid-template-columns: 1fr; } }
        .show { animation: popUp 0.8s forwards ease-out; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(20px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes popUp { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

        <div class="hero-text">

        </div>
    </div>
