<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brand Marketer | Kang JiHee</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: #111; 
            color: #ffffff;
        }

        /* 1. 첫 화면 (스크롤 유도를 위해 다시 화면에 꽉 차도록 100vh로 설정) */
        .hero-section {
            height: 100vh; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #111 0%, #1a1a1a 100%);
        }

        .hero-text {
            text-align: center;
            animation: fadeIn 1.5s ease-out;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            font-weight: 300;
            color: #888;
            letter-spacing: 6px;
            margin-top: 0;
        }

        /* 2. 회사별 카드형 갤러리 섹션 */
        .work-section {
            padding: 100px 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 50px;
            letter-spacing: 3px;
            color: #fff;
            font-weight: 500;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        @media (max-width: 768px) {
            .card-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
